[project]
name = "antra-postprocessing"
version = "0.1.0"
description = "Deduplicate music files downloaded via Antra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
antra-postprocessing = "antra_postprocessing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antra_postprocessing"]

